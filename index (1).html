<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Sudoku Solver Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤖 AI Sudoku Solver Challenge</h1>
        <p>Type a puzzle into the grid below (leave empty spaces blank), then hit solve to see the AI beat it in milliseconds!</p>
        
        <div id="grid-container"></div>
        
     <div class="controls">
    <button onclick="solveGame()">⚡ Let AI Solve</button>
    <button onclick="clearGrid()" class="clear-btn">🧹 Clear Grid</button>
</div>

<!-- NEW: Quick load presets -->
<div class="presets" style="margin-top: 15px;">
    <p style="font-size: 14px; color: #666; margin-bottom: 5px;">Quick Test Puzzles:</p>
    <button onclick="loadPreset('easy')" style="background: #28a745; padding: 6px 12px; font-size: 14px;">🟢 Load Easy</button>
    <button onclick="loadPreset('hard')" style="background: #dc3545; padding: 6px 12px; font-size: 14px;">🔴 Load Expert</button>
</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
